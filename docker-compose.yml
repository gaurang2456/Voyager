version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: voyager-postgres
    restart: always

    environment:
      POSTGRES_DB: voyager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Backend
    container_name: voyager-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/voyager
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: thisIsMySuperSecretJwtKeyForVoyagerApplication2026SpringBootSecurity

volumes:
  postgres-data: